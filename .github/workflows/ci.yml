name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Run CI checks
        run: make ci
      - name: Release dry-run
        run: goreleaser build --snapshot --clean --single-target --id desktop
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Run auth tests with CGO
        run: CGO_ENABLED=1 go test ./internal/auth/...

  test-nocgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Run auth tests without CGO
        run: CGO_ENABLED=0 go test ./internal/auth/...

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Stage binaries via GoReleaser
        run: goreleaser release --clean --snapshot --id container --skip=publish,announce,sbom
      - name: Build runtime-scratch
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-scratch
          platforms: linux/amd64
          push: false
          load: true
          tags: outlook-local-mcp:ci-scratch
      - name: Build runtime-distroless
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-distroless
          platforms: linux/amd64
          push: false
          load: true
          tags: outlook-local-mcp:ci-distroless
      - name: Smoke test scratch
        run: docker run --rm outlook-local-mcp:ci-scratch --version
      - name: Smoke test distroless
        run: docker run --rm outlook-local-mcp:ci-distroless --version
      - name: Assert distroless non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' outlook-local-mcp:ci-distroless)
          echo "Config.User=${user}"
          echo "${user}" | grep -qE '^(nonroot|65532)$'
