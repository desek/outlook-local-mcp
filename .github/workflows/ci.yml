# ci.yml - the Go application's pull-request checks.
#
# Scoped away from site-only changes. This workflow runs `make ci`, a GoReleaser
# dry-run, and four container builds with smoke tests; none of that is affected by a
# change under site/, and running it there costs several runner-minutes for no signal.
# The website has its own workflow (site.yml).
#
# `docs/**` is deliberately NOT ignored. The narrative docs are embedded into the binary
# (see docs/embed.go and the allowlist test), so a change there can fail Go tests. Those
# paths therefore trigger both this workflow and site.yml, which is correct: the same
# files are consumed by both the binary and the site build.
name: CI
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Run CI checks
        run: make ci
      - name: Release dry-run
        run: goreleaser build --snapshot --clean --single-target --id desktop
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Run auth tests with CGO
        run: CGO_ENABLED=1 go test ./internal/auth/...

  test-nocgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - name: Run auth tests without CGO
        run: CGO_ENABLED=0 go test ./internal/auth/...

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - uses: docker/setup-buildx-action@v4
      - name: Stage binaries via GoReleaser
        run: ./scripts/stage-container-binaries.sh
      - name: Build runtime-scratch
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-scratch
          platforms: linux/amd64
          push: false
          load: true
          tags: outlook-local-mcp:ci-scratch
      - name: Build runtime-distroless
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-distroless
          platforms: linux/amd64
          push: false
          load: true
          tags: outlook-local-mcp:ci-distroless
      # The binary takes no arguments: `--version` is ignored, the server starts,
      # reads EOF on stdin and exits 0. That proves only that the file is
      # executable. Drive a real MCP handshake instead so tool registration is
      # actually exercised.
      - name: Smoke test scratch
        run: ./scripts/smoke-test-image.sh outlook-local-mcp:ci-scratch
      - name: Smoke test distroless
        run: ./scripts/smoke-test-image.sh outlook-local-mcp:ci-distroless
      - name: Assert distroless non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' outlook-local-mcp:ci-distroless)
          echo "Config.User=${user}"
          echo "${user}" | grep -qE '^(nonroot|65532)$'

  # Guards the standalone path: a bare `docker build .` from a clean checkout,
  # with no GoReleaser step. This is what third-party build services (the Glama
  # MCP directory) and docker-compose use, so it must keep working independently
  # of the release stages above.
  container-build-standalone:
    name: container-build-standalone
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build default target from source
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: outlook-local-mcp:ci-standalone
      - name: Smoke test MCP introspection over stdio
        run: ./scripts/smoke-test-image.sh outlook-local-mcp:ci-standalone
      - name: Assert standalone non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' outlook-local-mcp:ci-standalone)
          echo "Config.User=${user}"
          echo "${user}" | grep -qE '^(nonroot|65532)$'
